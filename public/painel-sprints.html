     A seção de entrega por desenvolvedor só aparece se esse array existir.

   Opcional — array "chamados" (card extra, quantidade de issues):

<script>
    const soma = (lista, campo) => lista.reduce((acc, item) => acc + (Number(item[campo]) || 0), 0);
    const pct = (parte, total) => (total ? (parte / total) * 100 : 0);
    const fmtPct = (valor) => valor.toFixed(1).replace(".", ",") + "%";
    const ehMobile = () => window.innerWidth < 640;
    const fonteLegenda = () => ({ boxWidth: ehMobile() ? 10 : 12, font: { size: ehMobile() ? 10 : 11, weight: "600" } });
    const fonteEixo = () => ({ size: ehMobile() ? 10 : 12 });

    function totais(sprint) {
        const p = sprint.projetos;
        const total = soma(p, "total");
        const planejado = soma(p, "planejado");
        const naoPlanejado = soma(p, "naoPlanejado");
        const concluido = soma(p, "concluido");
        const transbordoCodigo = soma(p, "transbordoCodigo");
        const transbordoTeste = soma(p, "transbordoTeste");
        const transbordo = (transbordoCodigo || transbordoTeste) ? transbordoCodigo + transbordoTeste : soma(p, "transbordo");
        const temSplitTransbordo = p.some((item) => "transbordoCodigo" in item || "transbordoTeste" in item);
        return {
            total,
            planejado,
            naoPlanejado,
            concluido,
            transbordo,
            transbordoCodigo,
            transbordoTeste,
            temSplitTransbordo,
            bugDev: soma(p, "bugDev"),
            bugHml: soma(p, "bugHml"),
            bugProd: soma(p, "bugProd"),
            pctPlanejado: pct(planejado, total),
            pctNaoPlanejado: pct(naoPlanejado, total),
            pctConcluido: pct(concluido, total),
            pctTransbordo: pct(transbordo, total)
        };
    }

    function nomeCurto(nome) {
        const partes = String(nome || "")
            .trim()
            .split(/\s+/)
            .filter((p) => !/^(de|da|do|dos|das|e)$/i.test(p));
        if (partes.length <= 2) return partes.join(" ");
        return `${partes[0]} ${partes[partes.length - 1]}`;
    }

    function devsDaSprint(sprint) {
        return [...(sprint.devs || [])].sort(
            (a, b) => b.concluido - a.concluido || a.nome.localeCompare(b.nome, "pt-BR")
        );
    }

    function secaoDevs(sprint) {
        const devs = devsDaSprint(sprint);
        if (!devs.length) return "";

        const melhor = devs[0];
        const totalEntregue = soma(devs, "concluido");
        const linhas = devs.map((d) => `
            <tr class="hover:bg-slate-50">
                <td class="p-3.5 font-bold text-slate-800">${d.nome}</td>
                <td class="p-3.5 text-center">${d.total}</td>
                <td class="p-3.5 text-center text-emerald-600 font-bold">${d.concluido}</td>
                ${celulaNumero(d.transbordoCodigo, "text-sky-600")}
                ${celulaNumero(d.transbordoTeste, "text-yellow-600")}
                <td class="p-3.5 text-center font-semibold text-slate-700">${fmtPct(pct(d.concluido, d.total))}</td>
            </tr>
        `).join("");

        const altura = Math.max(ehMobile() ? 240 : 320, devs.length * (ehMobile() ? 40 : 44));

        return `
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-4 sm:mb-6">
                <div class="card">
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 mb-4">
                        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">SP entregues por desenvolvedor</h3>
                        <span class="text-[11px] text-slate-400 font-medium">${devs.length} pessoas · ${totalEntregue} SP</span>
                    </div>
                    <div class="chart-box" style="height: ${altura}px"><canvas id="chartDevs"></canvas></div>
                </div>
                <div class="card tabela-wrap">
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 mb-4">
                        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Entrega por Atribuído para</h3>
                        <span class="text-[11px] text-emerald-600 font-semibold">Maior entrega: ${nomeCurto(melhor.nome)} (${melhor.concluido} SP)</span>
                    </div>
                    <table class="w-full text-left text-sm border-collapse" style="min-width: 720px">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 uppercase text-[11px] font-bold tracking-wider">
                                <th class="p-3.5 rounded-l-lg">Desenvolvedor</th>
                                <th class="p-3.5 text-center">Alocado</th>
                                <th class="p-3.5 text-center text-emerald-600">Entregue</th>
                                <th class="p-3.5 text-center text-sky-600">T. Código</th>
                                <th class="p-3.5 text-center text-yellow-600">T. Teste</th>
                                <th class="p-3.5 text-center rounded-r-lg">% Entregue</th>
                            </tr>
                        </thead>
                        <tbody class="text-slate-600 divide-y divide-slate-100 font-medium">${linhas}</tbody>
                    </table>
                    <p class="text-[11px] text-slate-400 mt-3 leading-relaxed">
                        <span class="font-semibold text-sky-600">Transbordo de código:</span> Pronto para desenvolvimento, Em desenvolvimento, Pronto para revisão de código, Em revisão, Pronto para publicação DEV.
                        <span class="font-semibold text-yellow-600 ml-1">Transbordo de teste:</span> Pronto para qualidade, Em qualidade.
                    </p>
                </div>
            </div>
        `;
    }

    function secaoChamados(sprint) {
        const itens = sprint.chamados || [];
        if (!itens.length) return "";
        const linhas = itens.map((c) => `
            <tr class="hover:bg-slate-50">
                <td class="p-3.5 font-bold text-slate-800">#${c.id}</td>
                <td class="p-3.5">${c.projeto}</td>
                <td class="p-3.5">${c.tipo}</td>
                <td class="p-3.5">${c.titulo}</td>
                <td class="p-3.5">${c.atribuido}</td>
                <td class="p-3.5 text-emerald-600 font-semibold">${c.situacao}</td>
            </tr>
        `).join("");
        return `
            <div class="card tabela-wrap mb-4 sm:mb-6">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 mb-4">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Chamados</h3>
                    <span class="text-[11px] text-slate-400 font-medium">${itens.length} item${itens.length === 1 ? "" : "s"} · sem soma de SP neste card</span>
                </div>
                <table class="w-full text-left text-sm border-collapse" style="min-width: 720px">
                    <thead>

    function destaques(sprint) {
        const projetos = sprint.projetos;
        const maior = (campo) => [...projetos].sort((a, b) => b[campo] - a[campo] || b.total - a.total)[0];
        const maiorProjeto = maior("total");
        const maiorTransbordo = maior("transbordo");
        const maiorBugProd = maior("bugProd");
        const melhor = [...projetos]
            .filter((p) => p.total > 0)
            .sort((a, b) => {
                const pa = pct(a.concluido, a.total);
                const pb = pct(b.concluido, b.total);
                return pb - pa || b.total - a.total;
            })[0];

        return {
            maiorProjeto,
            maiorTransbordo,
            maiorBugProd,
            melhor
        };
    }

    let charts = [];
    function destruirGraficos() {
        charts.forEach((c) => c.destroy());
        charts = [];
    }

    function celulaNumero(valor, classe) {
        const destaque = valor > 0 && classe ? classe : "";
        const peso = valor > 0 && classe ? "font-bold" : "";
        return `<td class="p-3.5 text-center ${destaque} ${peso}">${valor}</td>`;
    }

    function ultimasSprints(n = 2) {
        return SPRINTS.slice(-n);
    }

    function chaveProjeto(nome) {
        const limpo = nome
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, " ")
            .trim();
        if (limpo.includes("cpiis") || limpo.includes("sevsap")) return "CPIIS";
        const canon = {
            "selecionases": "Seleciona SES",
            "seleciona ses": "Seleciona SES",
            "sipes": "SIPES",
            "sigape": "SIGAPE",
            "sinatt": "SINATT",
            "sisgrade": "SISGRADE",
            "sisvo": "SISVO",
            "cievs": "CIEVS",
            "formasus": "FORMASUS",
            "sirex": "SIREX",
            "observa att": "Observa ATT",
            "mae coruja": "Mãe Coruja",
            "sidda": "SIDDA",
            "rhose": "RHOSE"
        };
        return canon[limpo] || nome;
    }

    function deltaBadge(atual, anterior, { menorMelhor = false, casas = 0, sufixo = "" } = {}) {
        if (anterior == null || Number.isNaN(atual - anterior)) {
            return `<span class="text-xs text-slate-400 font-semibold">—</span>`;
        }
        const d = atual - anterior;
        if (Math.abs(d) < 0.05) {
            return `<span class="text-xs text-slate-400 font-bold">estável</span>`;
        }
        const melhor = menorMelhor ? d < 0 : d > 0;
        const cor = melhor ? "text-emerald-600" : "text-red-500";
        const seta = d > 0 ? "▲" : "▼";
        const abs = Math.abs(d).toFixed(casas).replace(".", ",");
        const sinal = d > 0 ? "+" : "−";
        return `<span class="${cor} text-xs font-bold">${seta} ${sinal}${abs}${sufixo}</span>`;
    }

    function projetosAlinhados(sprints) {
        const mapa = new Map();
        sprints.forEach((sprint, i) => {
            sprint.projetos.forEach((p) => {
                const chave = chaveProjeto(p.nome);
                if (!mapa.has(chave)) mapa.set(chave, { nome: chave, valores: Array(sprints.length).fill(0) });
                mapa.get(chave).valores[i] += p.total;
            });
        });
        return [...mapa.values()].sort((a, b) => (b.valores.at(-1) - a.valores.at(-1)) || a.nome.localeCompare(b.nome, "pt-BR"));
    }

    function rotuloComparativo() {
        const ids = ultimasSprints(2).map((s) => s.id);
        return ids.length ? `Comparativo ${ids.join("–")}` : "Comparativo";
    }

    function botaoAba(id, rotulo, idAtiva) {
        const ativa = id === idAtiva;
        return `<button type="button" class="tab-btn px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-bold transition ${ativa ? "active" : "text-slate-600 hover:bg-white/60"}" data-id="${id}">${rotulo}</button>`;
    }

    function renderAbas(idAtiva) {
        const nav = document.getElementById("abas");
        const atual = SPRINTS[SPRINTS.length - 1];
        const anteriores = SPRINTS.slice(0, -1).reverse();
        const partes = [];
        partes.push(botaoAba("comparativo", `<i class="fa-solid fa-chart-line mr-1.5"></i>${rotuloComparativo()}`, idAtiva));
        if (atual) partes.push(botaoAba(atual.id, atual.nome, idAtiva));
        anteriores.forEach((s) => partes.push(botaoAba(s.id, s.nome, idAtiva)));
        nav.innerHTML = partes.join("");

        nav.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", () => abrirAba(btn.dataset.id));
        });
        const abaAtiva = nav.querySelector(".tab-btn.active");
        if (abaAtiva) abaAtiva.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    }

        const kpis = [
            { label: "Story Points", icon: "fa-layer-group", cor: "border-blue-600", campo: "total", menorMelhor: false, casas: 0, sufixo: "" },

                ? [
                    { label: "T. Código", icon: "fa-code-branch", cor: "border-sky-500", campo: "transbordoCodigo", menorMelhor: true, casas: 0, sufixo: "" },

            { label: "Concluído (SP)", icon: "fa-check", cor: "border-emerald-400", campo: "concluido", menorMelhor: false, casas: 0, sufixo: "" }
        ];

        const cardsKpi = kpis.map((k) => {

                        <span>${k.label}</span><i class="fa-solid ${k.icon}"></i>
                    </div>
                    <div class="space-y-1 mb-3">${mini}</div>
                    <div class="pt-2 border-t border-slate-100">
                        ${deltaBadge(atual[k.campo], anterior ? anterior[k.campo] : null, { menorMelhor: k.menorMelhor, casas: k.casas, sufixo: k.sufixo })}
                        <span class="text-[10px] text-slate-400 font-medium hidden sm:inline ml-1">vs anterior</span>
                    </div>
                </div>`;
        }).join("");

        const linhasTabela = [
            { label: "Story Points", campo: "total" },
            { label: "Planejado", campo: "planejado" },
            { label: "Não Planejado", campo: "naoPlanejado" },
            { label: "% Planejado", campo: "pctPlanejado", fmt: fmtPct, casas: 1, sufixo: " pp" },
            { label: "% Não Planejado", campo: "pctNaoPlanejado", fmt: fmtPct, menorMelhor: true, casas: 1, sufixo: " pp" },
            { label: "Concluído", campo: "concluido" },
            { label: "% Concluído", campo: "pctConcluido", fmt: fmtPct, casas: 1, sufixo: " pp" },
            { label: "Transbordo", campo: "transbordo", menorMelhor: true },
            ...(atual.temSplitTransbordo ? [
                { label: "T. Código", campo: "transbordoCodigo", menorMelhor: true },
                { label: "T. Teste", campo: "transbordoTeste", menorMelhor: true }
            ] : []),
            { label: "Bug DEV", campo: "bugDev", menorMelhor: true },
            { label: "Bug HML", campo: "bugHml", menorMelhor: true },
            { label: "Bug PROD", campo: "bugProd", menorMelhor: true }
        ].map((linha) => {
            const cells = metricas.map((m, i) => {
                const valor = linha.fmt ? linha.fmt(m[linha.campo]) : m[linha.campo];
                const destaque = i === metricas.length - 1 ? "font-black text-slate-800" : "";
                return `<td class="p-3.5 text-center ${destaque}">${valor}</td>`;
            }).join("");
            return `<tr class="hover:bg-slate-50">
                <td class="p-3.5 font-bold text-slate-800">${linha.label}</td>
                ${cells}
                <td class="p-3.5 text-center">${deltaBadge(atual[linha.campo], anterior ? anterior[linha.campo] : null, { menorMelhor: !!linha.menorMelhor, casas: linha.casas || 0, sufixo: linha.sufixo || "" })}</td>
            </tr>`;
        }).join("");

        const cabecalhoSprints = sprints.map((s) => `<th class="p-3.5 text-center">${s.nome}</th>`).join("");
        const projetos = projetosAlinhados(sprints);
        const linhasProjetos = projetos.map((p) => {
            const cells = p.valores.map((v, i) => `<td class="p-3.5 text-center ${i === p.valores.length - 1 ? "font-black text-slate-800" : ""}">${v}</td>`).join("");
            return `<tr class="hover:bg-slate-50">
                <td class="p-3.5 font-bold text-slate-800">${p.nome}</td>
                ${cells}
                <td class="p-3.5 text-center">${deltaBadge(p.valores.at(-1), p.valores.length > 1 ? p.valores.at(-2) : null, { casas: 0 })}</td>
            </tr>`;
        }).join("");

        const avisos = [];
        if (sprints.length < 2) {
            avisos.push(`Há ${sprints.length} sprint cadastrada. Adicione outra para comparar atual x anterior.`);
        }
        if (anterior) {
            const dConc = atual.pctConcluido - anterior.pctConcluido;
            const dProd = atual.bugProd - anterior.bugProd;
            const dTrans = atual.transbordo - anterior.transbordo;
            if (dConc !== 0) {
                avisos.push(`Conclusão ${dConc > 0 ? "subiu" : "caiu"} ${Math.abs(dConc).toFixed(1).replace(".", ",")} pp da ${sprints.at(-2).nome} para a ${sprints.at(-1).nome}.`);
            }
            if (dProd !== 0) {
                avisos.push(`Bugs PROD ${dProd < 0 ? "caíram" : "subiram"} de ${anterior.bugProd} para ${atual.bugProd}.`);
            }
            if (dTrans !== 0) {
                avisos.push(`Transbordo ${dTrans < 0 ? "caiu" : "subiu"} de ${anterior.transbordo} para ${atual.transbordo} SP.`);
            }
            if (atual.temSplitTransbordo) {
                avisos.push(`Na sprint atual o transbordo se divide em ${atual.transbordoCodigo} SP de código e ${atual.transbordoTeste} SP de teste.`);
            }
        }

        document.getElementById("dashboard").innerHTML = `
            <div class="card mb-4 sm:mb-6 border border-slate-100">
                <p class="text-sm font-bold text-slate-700 flex items-start sm:items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-blue-600 mt-0.5 sm:mt-0 shrink-0"></i>
                    <span>Comparando: ${rotuloPeriodo}</span>
                </p>
                ${avisos.length ? `<ul class="mt-3 space-y-1 text-xs text-slate-600">${avisos.map((a) => `<li class="flex gap-2"><i class="fa-solid fa-caret-right text-blue-500 mt-0.5 shrink-0"></i><span>${a}</span></li>`).join("")}</ul>` : ""}
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4 mb-4 sm:mb-6">${cardsKpi}</div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-4 sm:mb-6">
                <div class="card">
                    <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase tracking-wider">${atual.temSplitTransbordo ? "Entrega: Total, Concluído, T. Código e T. Teste" : "Entrega: Total, Concluído e Transbordo"}</h3>
                    <div class="chart-box"><canvas id="chartCompEntrega"></canvas></div>
                </div>
                <div class="card">
                    <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase tracking-wider">Bugs por ambiente</h3>
                    <div class="chart-box"><canvas id="chartCompBugs"></canvas></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-4 sm:mb-6">
                <div class="card">
                    <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase tracking-wider">Percentuais ao longo das sprints</h3>
                    <div class="chart-box"><canvas id="chartCompPct"></canvas></div>
                </div>
                <div class="card">
                    <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase tracking-wider">Story Points por projeto</h3>
                    <div class="chart-box" style="height: ${Math.max(220, projetos.length * (window.innerWidth < 640 ? 36 : 28))}px"><canvas id="chartCompProjetos"></canvas></div>
                </div>
            </div>

            <div class="card tabela-wrap mb-4 sm:mb-6">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 mb-4">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Tabela comparativa de métricas</h3>
                    <span class="text-[11px] text-slate-400 font-medium">Deslize para o lado · Δ vs anterior</span>
                </div>
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 uppercase text-[11px] font-bold tracking-wider">
                            <th class="p-3.5 rounded-l-lg">Métrica</th>
                            ${cabecalhoSprints}
                            <th class="p-3.5 text-center rounded-r-lg">Δ</th>
                        </tr>
                    </thead>
                    <tbody class="text-slate-600 divide-y divide-slate-100 font-medium">${linhasTabela}</tbody>
                </table>
            </div>

            <div class="card tabela-wrap mb-4 sm:mb-6">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 mb-4">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Story Points por projeto — atual x anterior</h3>
                    <span class="text-[11px] text-slate-400 font-medium">Deslize para o lado</span>
                </div>
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 uppercase text-[11px] font-bold tracking-wider">
                            <th class="p-3.5 rounded-l-lg">Projeto</th>
                            ${cabecalhoSprints}
                            <th class="p-3.5 text-center rounded-r-lg">Δ</th>
                        </tr>
                    </thead>
                    <tbody class="text-slate-600 divide-y divide-slate-100 font-medium">${linhasProjetos}</tbody>
                </table>
            </div>
        `;

        montarGraficosComparativo(sprints, metricas, projetos);
    }

    function montarGraficosComparativo(sprints, metricas, projetos) {
        destruirGraficos();
        const labels = sprints.map((s) => s.nome);
        const coresSprint = ["#94a3b8", "#6366f1", "#1e3a8a"].slice(-sprints.length);
        const optsBar = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: "top", labels: fonteLegenda() } },
            scales: {
                x: { grid: { display: false }, ticks: { font: fonteEixo(), maxRotation: ehMobile() ? 0 : 0 } },
                y: { grid: { color: "#f1f5f9" }, beginAtZero: true, ticks: { font: fonteEixo() } }
            }
        };

        charts.push(new Chart(document.getElementById("chartCompEntrega"), {
            type: "bar",
            data: {
                labels,
                datasets: [
                    { label: "Total", data: metricas.map((m) => m.total), backgroundColor: "#1e3a8a", borderRadius: 4 },
                    { label: "Concluído", data: metricas.map((m) => m.concluido), backgroundColor: "#10b981", borderRadius: 4 },
                    ...(metricas.at(-1)?.temSplitTransbordo
                        ? [
                            { label: "T. Código", data: metricas.map((m) => m.transbordoCodigo), backgroundColor: "#0ea5e9", borderRadius: 4 },
                            { label: "T. Teste", data: metricas.map((m) => m.transbordoTeste), backgroundColor: "#f59e0b", borderRadius: 4 }
                        ]
                        : [
                            { label: "Transbordo", data: metricas.map((m) => m.transbordo), backgroundColor: "#f59e0b", borderRadius: 4 }
                        ])
                ]
            },
            options: optsBar
        }));

        charts.push(new Chart(document.getElementById("chartCompBugs"), {
            type: "bar",
            data: {
                labels,
                datasets: [
                    { label: "Bug DEV", data: metricas.map((m) => m.bugDev), backgroundColor: "#22c55e", borderRadius: 4 },
                    { label: "Bug HML", data: metricas.map((m) => m.bugHml), backgroundColor: "#eab308", borderRadius: 4 },
                    { label: "Bug PROD", data: metricas.map((m) => m.bugProd), backgroundColor: "#ef4444", borderRadius: 4 }
                ]
            },
            options: optsBar
        }));

        charts.push(new Chart(document.getElementById("chartCompPct"), {
            type: "line",
            data: {
                labels,
                datasets: [
                    { label: "% Concluído", data: metricas.map((m) => Number(m.pctConcluido.toFixed(1))), borderColor: "#10b981", backgroundColor: "#10b98133", tension: 0.25, fill: false },
                    { label: "% Planejado", data: metricas.map((m) => Number(m.pctPlanejado.toFixed(1))), borderColor: "#6366f1", backgroundColor: "#6366f133", tension: 0.25, fill: false },
                    { label: "% Não Planejado", data: metricas.map((m) => Number(m.pctNaoPlanejado.toFixed(1))), borderColor: "#a855f7", backgroundColor: "#a855f733", tension: 0.25, fill: false }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: "top", labels: fonteLegenda() } },
                scales: {
                    x: { grid: { display: false }, ticks: { font: fonteEixo() } },
                    y: { grid: { color: "#f1f5f9" }, beginAtZero: true, max: 100, ticks: { callback: (v) => v + "%", font: fonteEixo() } }
                }
            }
        }));

        charts.push(new Chart(document.getElementById("chartCompProjetos"), {
            type: "bar",
            data: {
                labels: projetos.map((p) => p.nome),
                datasets: sprints.map((s, i) => ({
                    label: s.nome,
                    data: projetos.map((p) => p.valores[i]),
                    backgroundColor: coresSprint[i],
                    borderRadius: 3
                }))
            },
            options: {
                indexAxis: "y",
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: "top", labels: fonteLegenda() } },
                scales: { x: { grid: { color: "#f1f5f9" }, beginAtZero: true, ticks: { font: fonteEixo() } }, y: { grid: { display: false }, ticks: { font: fonteEixo() } } }
            }
        }));
    }

    function montarGraficos(sprint, t) {
        destruirGraficos();
        const nomes = sprint.projetos.map((p) => p.nome);
        const optionsDoughnut = {
            responsive: true,
            plugins: {
                legend: { position: "bottom", labels: fonteLegenda() }
            }
        };

        const somaConcTrans = t.concluido + t.transbordo;
        const pctConcDonut = pct(t.concluido, somaConcTrans);
        const pctTransDonut = pct(t.transbordo, somaConcTrans);
        const pctCodigoDonut = pct(t.transbordoCodigo, somaConcTrans);
        const pctTesteDonut = pct(t.transbordoTeste, somaConcTrans);

        charts.push(new Chart(document.getElementById("chartPlan"), {
            type: "doughnut",
            data: {
                labels: [`Planejado (${fmtPct(t.pctPlanejado)})`, `Não Plan. (${fmtPct(t.pctNaoPlanejado)})`],
                datasets: [{ data: [t.planejado, t.naoPlanejado], backgroundColor: ["#6366f1", "#a855f7"], borderWidth: 0 }]
            },
            options: optionsDoughnut
        }));

        charts.push(new Chart(document.getElementById("chartConc"), {
            type: "doughnut",
            data: t.temSplitTransbordo ? {
                labels: [`Concluído (${fmtPct(pctConcDonut)})`, `T. Código (${fmtPct(pctCodigoDonut)})`, `T. Teste (${fmtPct(pctTesteDonut)})`],
                datasets: [{ data: [t.concluido, t.transbordoCodigo, t.transbordoTeste], backgroundColor: ["#10b981", "#0ea5e9", "#f59e0b"], borderWidth: 0 }]
            } : {
                labels: [`Concluído (${fmtPct(pctConcDonut)})`, `Transbordo (${fmtPct(pctTransDonut)})`],
                datasets: [{ data: [t.concluido, t.transbordo], backgroundColor: ["#10b981", "#f59e0b"], borderWidth: 0 }]
            },
            options: optionsDoughnut
        }));

        charts.push(new Chart(document.getElementById("chartSP"), {
            type: "bar",
            data: {
                labels: nomes,
                datasets: [{
                    label: "Total de SP",
                    data: sprint.projetos.map((p) => p.total),
                    backgroundColor: "#1e3a8a",
                    borderRadius: 4
                }]
            },
            options: {
                indexAxis: "y",
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { grid: { display: false }, ticks: { font: fonteEixo() } }, y: { grid: { display: false }, ticks: { font: fonteEixo() } } }
            }
        }));

        charts.push(new Chart(document.getElementById("chartBugs"), {
            type: "bar",
            data: {
                labels: nomes,
                datasets: [
                    { label: "Bug DEV", data: sprint.projetos.map((p) => p.bugDev), backgroundColor: "#22c55e", borderRadius: 2 },
                    { label: "Bug HML", data: sprint.projetos.map((p) => p.bugHml), backgroundColor: "#eab308", borderRadius: 2 },
                    { label: "Bug PROD", data: sprint.projetos.map((p) => p.bugProd), backgroundColor: "#ef4444", borderRadius: 2 }
                ]
            },
            options: {
                indexAxis: "y",
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true, grid: { display: false }, ticks: { font: fonteEixo() } },
                    y: { stacked: true, grid: { display: false }, ticks: { font: fonteEixo() } }
                },
                plugins: { legend: { position: "top", labels: fonteLegenda() } }
            }
        }));

        const elDevs = document.getElementById("chartDevs");
        if (elDevs) {
            const devs = devsDaSprint(sprint);
            charts.push(new Chart(elDevs, {
                type: "bar",
                data: {
                    labels: devs.map((d) => nomeCurto(d.nome)),
                    datasets: [
                        { label: "Entregue", data: devs.map((d) => d.concluido), backgroundColor: "#10b981", borderRadius: 3 },
                        { label: "Transbordo de código", data: devs.map((d) => d.transbordoCodigo || 0), backgroundColor: "#0ea5e9", borderRadius: 3 },
                        { label: "Transbordo de teste", data: devs.map((d) => d.transbordoTeste || 0), backgroundColor: "#f59e0b", borderRadius: 3 }
                    ]
                },
                options: {
                    indexAxis: "y",
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { color: "#f1f5f9" }, beginAtZero: true, ticks: { font: fonteEixo() } },
                        y: { stacked: true, grid: { display: false }, ticks: { font: fonteEixo() } }
                    },
                    plugins: { legend: { position: "top", labels: fonteLegenda() } }
                }
            }));
        }
    }

    function abrirAba(id) {
        if (id === "comparativo") {
            localStorage.setItem("ses-painel-sprint-ativa", "comparativo");
            history.replaceState(null, "", "#comparativo");
            renderAbas("comparativo");
            renderComparativo();
            window.scrollTo(0, 0);
            return;
        }
        const sprint = SPRINTS.find((s) => s.id === id) || SPRINTS[SPRINTS.length - 1];
        localStorage.setItem("ses-painel-sprint-ativa", sprint.id);
        history.replaceState(null, "", `#sp${sprint.id}`);
        renderAbas(sprint.id);
        renderDashboard(sprint);
        window.scrollTo(0, 0);
    }

    function abaInicial() {
        const hash = (location.hash || "").replace("#", "");
        if (hash === "comparativo") return "comparativo";
        const idHash = hash.replace(/^sp/, "");
        if (SPRINTS.some((s) => s.id === idHash)) return idHash;
        return SPRINTS[SPRINTS.length - 1].id;
    }

    abrirAba(abaInicial());
    window.addEventListener("hashchange", () => abrirAba(abaInicial()));
</script>
</body>
</html>
